name: Daily Tech News Digest

on:
  schedule:
    # Corre a las 11:00 y 12:00 UTC. El script envía solo si la hora en Chile
    # (America/Santiago) cae en la ventana 08:00-09:59; el control de ya-enviado
    # evita duplicados, así que la ejecución sobrante actúa de reintento si la
    # primera falló, y el cambio de hora chileno no requiere editar esto.
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Reenviar aunque el digest de hoy ya se haya enviado"
        type: boolean
        default: false

permissions:
  contents: write  # necesario para poder commitear el digest de vuelta al repo

# Nunca correr dos envíos a la vez (incluido el workflow "Más noticias", que
# comparte este grupo): si una ejecución sigue viva cuando parte la siguiente,
# la segunda espera en cola y al partir ve el estado ya commiteado.
concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # corta descargas o APIs colgadas; el otro cron reintenta
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
        # Las ejecuciones manuales saltan el control de hora automáticamente
        # (el script mira GITHUB_EVENT_NAME); --force además permite reenviar.
        run: python news_digest.py ${{ inputs.force && '--force' || '' }}

      - name: Commit digest history
        run: |
          git config user.name "tech-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A  # digests/ y digest_state.json
          if git diff --staged --quiet; then
            echo "Sin cambios que commitear"
            exit 0
          fi
          git commit -m "Digest del $(date -u +'%Y-%m-%d')"
          # main puede haber avanzado mientras corría el job (un push manual):
          # sin esto el push fallaba y el digest quedaba enviado pero sin
          # registrar (dedup ciega + link de versión extendida en 404).
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rechazado (el remoto avanzó); rebase y reintento ($i/3)"
            git pull --rebase origin main
          done
          echo "No se pudo pushear tras 3 rebases"
          exit 1

name: Daily Tech News Digest

on:
  schedule:
    # El mensaje debe LLEGAR a las 08:00 en punto (hora de Chile), pero los
    # cron de Actions parten con atraso impredecible (a veces >1 hora). Por eso
    # hay varios arranques ANTES de las 08:00 locales: el primero que caiga en
    # la antesala (MAX_WAIT_MINUTES en config.py) prepara el digest y duerme
    # hasta las 08:00:00 exactas para enviar. Los demás salen solos: muy
    # temprano no hacen nada, y después de las 08:00 actúan de reintento
    # inmediato si nada se envió. Las horas cubren invierno (UTC-4) y verano
    # (UTC-3) chilenos sin editar esto.
    - cron: "40 9 * * *"   # verano 06:40 (antesala) / invierno 05:40 (sale)
    - cron: "20 10 * * *"  # verano 07:20 (antesala) / invierno 06:20 (antesala)
    - cron: "20 11 * * *"  # verano 08:20 (reintento) / invierno 07:20 (antesala)
    - cron: "30 12 * * *"  # verano 09:30 (reintento) / invierno 08:30 (reintento)
  workflow_dispatch:
    inputs:
      force:
        description: "Reenviar aunque el digest de hoy ya se haya enviado"
        type: boolean
        default: false

permissions:
  contents: write  # necesario para poder commitear el digest de vuelta al repo

# Nunca correr dos digests a la vez: mientras una ejecución espera dormida
# hasta las 08:00 (o sigue viva por atraso), la siguiente queda en cola y al
# partir verá el estado ya commiteado y saldrá sin enviar. La cola no consume
# minutos de Actions; solo la ejecución que duerme lo hace.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    # Debe cubrir la espera hasta las 08:00 (hasta MAX_WAIT_MINUTES) más el
    # trabajo previo; también corta descargas o APIs colgadas y deja que el
    # siguiente cron reintente.
    timeout-minutes: 115
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # La punta de main AL EJECUTAR, no el SHA fijado al disparar el
          # cron: un run encolado por concurrency partiría con un snapshot
          # anterior al push del run que lo precedió, vería el estado sin
          # el digest de hoy y lo reenviaría (pasó el 24-07-2026: dos
          # mensajes casi idénticos a las 08:00).
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
        # Las ejecuciones manuales saltan el control de hora automáticamente
        # (el script mira GITHUB_EVENT_NAME); --force además permite reenviar.
        run: python news_digest.py ${{ inputs.force && '--force' || '' }}

      - name: Commit digest history
        run: |
          git config user.name "tech-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A  # digests/ y digest_state.json
          if git diff --staged --quiet; then
            echo "Sin cambios que commitear"
            exit 0
          fi
          git commit -m "Digest del $(date -u +'%Y-%m-%d')"
          # main puede haber avanzado mientras corría el job (un push manual):
          # sin esto el push fallaba y el digest quedaba enviado pero sin
          # registrar (dedup ciega + link de versión extendida en 404).
          # No se usa `git pull --rebase`: si el remoto también subió el
          # digest de hoy (run local pusheado a mano) el rebase queda a
          # medias con conflictos y, con `bash -e`, mata el step. En su
          # lugar se recommitea encima del remoto quedándose con NUESTROS
          # archivos, que son los que este run envió de verdad por WhatsApp.
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rechazado (el remoto avanzó); recommit y reintento ($i/3)"
            git fetch origin main
            NUESTRO=$(git rev-parse HEAD)
            git reset --hard origin/main
            git checkout "$NUESTRO" -- digests/ digest_state.json
            git add -A
            if git diff --staged --quiet; then
              echo "El remoto ya contiene exactamente estos cambios"
              exit 0
            fi
            git commit -m "Digest del $(date -u +'%Y-%m-%d')"
          done
          echo "No se pudo pushear tras 3 reintentos"
          exit 1

name: Daily Tech News Digest

on:
  schedule:
    # Corre a las 11:00 y 12:00 UTC. El script decide (usando America/Santiago)
    # cuál de las dos corresponde a las 08:00 de Chile y solo esa envía; la otra
    # sale de inmediato. Así el cambio de hora chileno no requiere editar esto.
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Reenviar aunque el digest de hoy ya se haya enviado"
        type: boolean
        default: false

permissions:
  contents: write  # necesario para poder commitear el digest de vuelta al repo

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
        # Las ejecuciones manuales saltan el control de hora automáticamente
        # (el script mira GITHUB_EVENT_NAME); --force además permite reenviar.
        run: python news_digest.py ${{ inputs.force && '--force' || '' }}

      - name: Commit digest history
        run: |
          git config user.name "tech-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A  # digests/ y digest_state.json
          git diff --staged --quiet || git commit -m "Digest del $(date -u +'%Y-%m-%d')"
          git push
